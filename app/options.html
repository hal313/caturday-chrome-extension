<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>caturday options</title>
  <link rel="stylesheet" href="styles/main.css">
</head>

<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">

  <main class="mx-auto max-w-xl px-6 py-12">

    <header class="mb-8 flex items-center gap-4">
      <img src="images/icon-128.png" alt="" class="size-12">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">caturday options</h1>
        <p class="text-sm text-slate-500">Settings sync to every Chrome profile signed in to your Google account.</p>
      </div>
    </header>

    <!--
      Each setting is a checkbox styled as a sliding switch. The input's `name`
      matches the setting's key in scripts/settings.js.
    -->
    <form id="options-form" class="divide-y divide-slate-200 rounded-xl bg-white shadow-sm ring-1 ring-slate-200">

      <label class="flex cursor-pointer items-center justify-between gap-6 p-5">
        <span>
          <span class="block font-medium">Animated cats only</span>
          <span class="block text-sm text-slate-500">Show GIFs. Turn this off to see still photos instead.</span>
        </span>
        <span class="relative inline-flex shrink-0">
          <input type="checkbox" name="animatedOnly" role="switch" class="peer sr-only">
          <span class="h-6 w-11 rounded-full bg-slate-300 transition-colors peer-checked:bg-indigo-600 peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-indigo-600"></span>
          <span class="pointer-events-none absolute top-0.5 left-0.5 size-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5"></span>
        </span>
      </label>

      <label class="flex cursor-pointer items-center justify-between gap-6 p-5">
        <span>
          <span class="block font-medium">Load a cat when opened</span>
          <span class="block text-sm text-slate-500">Fetch a cat as soon as the popup opens, without pressing the button.</span>
        </span>
        <span class="relative inline-flex shrink-0">
          <input type="checkbox" name="loadOnOpen" role="switch" class="peer sr-only">
          <span class="h-6 w-11 rounded-full bg-slate-300 transition-colors peer-checked:bg-indigo-600 peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-indigo-600"></span>
          <span class="pointer-events-none absolute top-0.5 left-0.5 size-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5"></span>
        </span>
      </label>

    </form>

    <p id="status" class="mt-4 h-5 text-sm text-slate-500 transition-opacity" role="status" aria-live="polite"></p>

  </main>

  <script type="module" src="scripts/options.js"></script>
</body>

</html>
