<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>caturday</title>
  <link rel="stylesheet" href="styles/main.css">
</head>

<body class="w-[400px] bg-white p-4 text-slate-800">

  <div class="mb-4 flex items-center gap-2">
    <!-- Load another cat -->
    <button id="button-next" type="button"
      class="flex-1 rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white shadow-sm transition hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:cursor-wait disabled:opacity-60">
      Moar Caturday!
    </button>

    <!-- Open the options page -->
    <button id="button-options" type="button" title="Options" aria-label="Options"
      class="rounded-lg p-2 text-slate-500 transition hover:bg-slate-100 hover:text-slate-700 focus-visible:outline-2 focus-visible:outline-indigo-600">
      <svg class="size-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M7.84 1.804A1 1 0 0 1 8.82 1h2.36a1 1 0 0 1 .98.804l.331 1.652a6.993 6.993 0 0 1 1.929 1.115l1.598-.54a1 1 0 0 1 1.186.447l1.18 2.044a1 1 0 0 1-.205 1.251l-1.267 1.113a7.047 7.047 0 0 1 0 2.228l1.267 1.113a1 1 0 0 1 .206 1.25l-1.18 2.045a1 1 0 0 1-1.187.447l-1.598-.54a6.993 6.993 0 0 1-1.929 1.115l-.33 1.652a1 1 0 0 1-.98.804H8.82a1 1 0 0 1-.98-.804l-.331-1.652a6.993 6.993 0 0 1-1.929-1.115l-1.598.54a1 1 0 0 1-1.186-.447l-1.18-2.044a1 1 0 0 1 .205-1.251l1.267-1.114a7.05 7.05 0 0 1 0-2.227L1.821 7.773a1 1 0 0 1-.206-1.25l1.18-2.045a1 1 0 0 1 1.187-.447l1.598.54A6.992 6.992 0 0 1 7.51 3.456l.33-1.652ZM10 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" clip-rule="evenodd" />
      </svg>
    </button>
  </div>

  <!-- This is where the kitty image will go -->
  <div class="flex h-[275px] items-center justify-center overflow-hidden rounded-lg bg-slate-50">
    <img id="main-image" alt="A random cat" class="max-h-full max-w-full" hidden>
    <p id="status" class="px-6 text-center text-sm text-slate-500" role="status"></p>
  </div>

  <script type="module" src="scripts/popup.js"></script>
</body>

</html>
